[package]
name = "ternary-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dullfig/ternary-rs"
description = "Pure-Rust 1.58-bit inference engine — ternary matmul, LUT kernels, zero multiplication."
keywords = ["bitnet", "ternary", "inference", "llm", "machine-learning"]
categories = ["science", "mathematics"]

[features]
default = ["gpu"]
gpu = ["wgpu", "pollster", "bytemuck"]

[dependencies]
thiserror = "2"
tracing = "0.1"
rayon = "1"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
